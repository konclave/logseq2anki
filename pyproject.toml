[project]
name = "logseq2anki"
version = "0.1.0"
description = "A Python CLI tool to convert Logseq journal notes to Anki flashcards."
authors = [
    { name = "Your Name", email = "your.email@example.com" } # Replace with actual author info
]
dependencies = [
    "requests",
    "google-genai",
    "rich",
    "python-dotenv",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" } # Or choose a different license

[project.scripts]
logseq2anki = "src.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
